apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-users
  namespace: insurance
data:
  otel-user.xml: |
    <clickhouse>
        <users>
            <otel>
                <password>otelpass</password>
                <profile>default</profile>
                <quota>default</quota>
                <networks>
                    <ip>::/0</ip>
                </networks>
                <!-- allow CREATE TABLE etc. -->
                <access_management>1</access_management>
            </otel>
        </users>
    </clickhouse>